
name: Build AI SIGNAL PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name 'AI-SIGNAL-PRO2-Source.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          gradle --no-daemon -p extracted assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SIGNAL-PRO-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
